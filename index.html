    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "AETHER",
        "alternateName": "AETHER — Beyond the known",
        "url": "https://ahmadbhanvadiya-dot.github.io/aether/",
        "description": "A cinematic, real-time 3D journey through an invented universe, built in the browser. Land on seven generated worlds in two star systems, scan what you find, and follow a story told through your discoveries.",
        "image": "https://ahmadbhanvadiya-dot.github.io/aether/og.jpg",
        "genre": ["Exploration", "Adventure"],
        "gamePlatform": "Web browser",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any (a browser with WebGL 2)",
        "playMode": "SinglePlayer",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "author": { "@type": "Person", "name": "Ahmad", "url": "https://github.com/ahmadbhanvadiya-dot" }
      }

    <!-- What shows (and what crawlers read) before the scripts run; React replaces it. -->
    <style>
      .intro {
        display: grid;
        place-content: center;
        gap: 12px;
        height: 100%;
        padding: 0 24px;
        text-align: center;
        color: #8a93b8;
        font: 14px/1.6 system-ui, sans-serif;
      }
      .intro h1 {
        margin: 0;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 0.5em;
        color: #c9d0ee;
      }
      .intro p {
        margin: 0 auto;
        max-width: 34em;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="intro">
        <h1>AETHER</h1>
        <p>Beyond the known.</p>
        <p>
          A cinematic, real-time 3D journey through an invented universe, in your browser. Land on seven worlds in two
          star systems, scan what you find, and follow a signal from no point in the system.
        </p>
        <noscript><p>AETHER needs JavaScript and WebGL 2 to run.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
